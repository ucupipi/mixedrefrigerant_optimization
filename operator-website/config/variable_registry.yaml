        role: FEATURE_DECISION
        model_feature: "xi_1 (via ILR)"
        range_instrument: [0.50, 8.50]
        range_training: [0.50, 8.50]
        scenario_editable: true
        operator_visible: true
        status: VERIFIED
        description_id: "Fraksi mol nitrogen dalam MCR. Sumber: Kromatografi Gas (GC) laboratorium dari drum 4C-8."

      - id: comp_C1
