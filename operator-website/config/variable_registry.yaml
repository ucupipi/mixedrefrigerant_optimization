  - id: mche
    label_id: "MCHE (Penukar Panas Kriogenik Utama)"
    label_en: "Main Cryogenic Heat Exchanger"
    variables:
      - id: MCHE_dT_cold_bundle_approach
        label_id: "Pendekatan suhu cold bundle MCHE"
        label_en: "MCHE cold bundle temperature approach"
        tag_dcs: "Computed: H5TI0026 - H5TI0021"
        unit: "°C"
        data_type: float64
        source: Engineered
        role: FEATURE_ENGINEERED
        model_feature: MCHE_dT_cold_bundle_approach
        scenario_editable: false
        operator_visible: false
        status: VERIFIED

      - id: MCHE_dT_shell_span
        label_id: "Rentang suhu shell MCHE"
        label_en: "MCHE shell temperature span"
        tag_dcs: "Computed: H5TI0047 - H5TI0025"
        unit: "°C"
        data_type: float64
        source: Engineered
        role: FEATURE_ENGINEERED
        model_feature: MCHE_dT_shell_span
        scenario_editable: false
        operator_visible: false
        status: VERIFIED

  - id: prediction_targets
    label_id: "Hasil Prediksi Model"
    label_en: "Model Prediction Outputs"
    variables:
      - id: total_shaft_power_mw
        label_id: "Daya poros total Train C3MR"
        label_en: "Total C3MR train shaft power"
        unit: "MW"
        data_type: float64
        source: Model Prediction
        role: MODEL_OUTPUT
        range_physical: [40.0, 150.0]
        operator_visible: true
        status: VERIFIED
        description_id: "Prediksi total daya poros kompresor C3MR (4KT-1 + 4KT-2 + 4KT-3). Bukan instruksi untuk mengubah set point."

safety_boundaries:
  - id: antisurge_flow_floor
    parameter: "Batas minimum aliran anti-surge"
    value: 480.0
    unit: "t/h"
    tag_dcs: "H4FI011B (x 36.8 kg/m3)"
    source: "Operating Manual Book 5, pp. 78-80"
    status: VERIFIED

  - id: suction_tal
    parameter: "Batas alarm bawah suhu suction drum (TAL)"
    value: -45.0
    unit: "°C"
    tag_dcs: H4TI004B
    source: "AGENTS.md, Manual Book"
    status: VERIFIED

  - id: mche_mita
    parameter: "Pendekatan suhu internal minimum MCHE (MITA)"
    value: 1.50
    unit: "°C"
    source: "AGENTS.md, Manual Book"
    status: VERIFIED

  - id: mahalanobis_limit
    parameter: "Batas jarak Mahalanobis komposisi MCR"
    value: 3.080216
    unit: "dimensionless"
    source: "χ²₀.₉₅,₄"
    status: VERIFIED

