        operator_visible: true
        status: VERIFIED

      - id: comp_C2H4
        label_id: "Etilena (C₂H₄)"
        label_en: "Ethylene (C2H4)"
        tag_dcs: comp_4C-8_C2H4
        unit: "mol%"
        data_type: float64
        source: Lab GC
        role: FEATURE_DECISION
        range_instrument: [0.00, 45.00]
        range_training: [0.00, 45.00]
        scenario_editable: true
        operator_visible: true
        status: VERIFIED

      - id: comp_C3
        label_id: "Propana (C₃H₈)"
        label_en: "Propane (C3)"
        tag_dcs: comp_4C-8_C3
        unit: "mol%"
        data_type: float64
        source: Lab GC
        role: FEATURE_DECISION
        range_instrument: [0.00, 12.00]
        range_training: [0.00, 12.00]
